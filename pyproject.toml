[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-assistant"
version = "0.2.0"
description = "Offline real-time dictation for the Linux desktop, powered by Whisper"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Vinay Kumar Reddy" }]
keywords = ["whisper", "dictation", "speech-to-text", "wayland", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "evdev>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
voice = "voice_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
